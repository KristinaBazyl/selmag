version: '3.9'

services:
  # PostgreSQL для бизнес-логики каталога
  postgres:
    image: postgres:14
    container_name: catalogue-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: catalogue
      POSTGRES_USER: catalogue
      POSTGRES_PASSWORD: catalogue
    ports:
      - "5432:5432"
    volumes:
      - catalogue_data:/var/lib/postgresql/data

  # PostgreSQL для Keycloak
  keycloak-db:
    image: postgres:14
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5434:5432"
    volumes:
      - keycloak_data:/var/lib/postgresql/data

  # Keycloak-сервер
  selmag-keycloak:
    image: quay.io/keycloak/keycloak:23.0.4
    container_name: selmag-keycloak
    depends_on:
      - keycloak-db
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME_STRICT: false
    ports:
      - "8082:8080"
    command: [ "start-dev", "--import-realm", "--http-host=0.0.0.0", "--hostname-strict=false" ]
    volumes:
      - ./config/keycloak/import:/opt/keycloak/data/import

#    Mongo DB feedback-сервиса
  feedback-db:
    image: mongo:7
    container_name: feedback-db
    restart: unless-stopped
#    environment:
#      MONGO_INITDB_ROOT_USERNAME: admin
#      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - "27017:27017"
    volumes:
      - feedback_data:/data/db


volumes:
  catalogue_data:
  keycloak_data:
  feedback_data: